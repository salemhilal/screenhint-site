<!doctype html>
<!-- The image shown when a link to the site is shared (og:image), as a page to screenshot.
     build.sh renders it to src/static/img/social-preview.png.

     It is drawn with the site's own stylesheet, so build the site first (npm run deploy).
     The scene markup is copied from src/_includes/section.header.njk; with no .is-playing class
     it shows the resting state, with the hint placed beside the window. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ScreenHint social preview</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../public/css/page.css">
<style>
  html, body { margin: 0; }
  /* 1200×630 is the size link previews expect */
  .preview { width: 1200px; height: 630px; overflow: hidden; font-family: 'Space Grotesk', sans-serif; }
  .preview > * { position: absolute; }
  .preview__logo { left: 64px; top: 44px; display: flex; align-items: center; gap: 5px; font-size: 40px; font-weight: 600; letter-spacing: -1px; line-height: 1; color: #000; }
  .preview__logo span:last-child { padding: 3px 8px; border-radius: 3px; background: var(--mustard); }
  .preview__title { left: 64px; top: 128px; z-index: 2; padding: 22px 40px 28px; }
  .preview__title h1 { margin: 0; font-size: 80px; font-weight: 500; line-height: 1.12; letter-spacing: -0.01em; white-space: nowrap; color: #000; }
  /* The window runs off the bottom edge; the hint sits clear of the title card */
  .preview .scene { left: 330px; top: 318px; width: 780px; cursor: default; }
  .preview .scene-cursor { transform: translate(9em, 2.9em); }
</style>
</head>
<body>
<div class="preview graph-paper">
  <div class="preview__logo"><span>screen</span><span>hint</span></div>
  <div class="hint-card preview__title"><h1>Photographic memory<br>at your fingertips.</h1></div>
  <div class="scene">
<div class="scene__inner" aria-hidden="true">
      <div class="scene-win">
        <div class="scene-win__bar"><i></i><i></i><i></i></div>
        <div class="scene-win__side"><b></b><b></b><b></b><b></b><b></b><b></b></div>
        <div class="scene-page scene-page--report">
          <div class="scene-bar scene-bar--h" style="top:.45em;width:1.8em"></div>
          <div class="scene-bar" style="top:.82em;width:4.2em"></div>
          <div class="scene-bar" style="top:1em;width:3.3em"></div>
          <div class="scene-stat"><span>Weekly signups</span><strong>1,284</strong><div><i style="height:35%"></i><i style="height:50%"></i><i style="height:42%"></i><i style="height:68%"></i><i style="height:100%"></i></div></div>
          <div class="scene-panel">
            <div class="scene-bar" style="top:.25em;width:1.1em"></div>
            <div class="scene-bar" style="top:.5em;width:1.5em"></div>
            <div class="scene-bar" style="top:.68em;width:1.3em"></div>
            <div class="scene-bar" style="top:.86em;width:1.45em"></div>
            <div class="scene-bar" style="top:1.04em;width:.9em"></div>
          </div>
          <div class="scene-bar" style="top:3.85em;width:4.5em"></div>
          <div class="scene-bar" style="top:4.03em;width:4.1em"></div>
          <div class="scene-bar" style="top:4.21em;width:4.4em"></div>
          <div class="scene-bar" style="top:4.39em;width:2.6em"></div>
        </div>
        <div class="scene-page scene-page--draft">
          <div class="scene-bar scene-bar--h" style="top:.45em;width:2.4em"></div>
          <div class="scene-bar" style="top:.95em;width:4.4em"></div>
          <div class="scene-bar" style="top:1.13em;width:4.1em"></div>
          <div class="scene-bar" style="top:1.31em;width:4.5em"></div>
          <div class="scene-bar" style="top:1.49em;width:3.2em"></div>
          <div class="scene-bar" style="top:1.95em;width:4.3em"></div>
          <div class="scene-bar" style="top:2.13em;width:4.5em"></div>
          <div class="scene-bar" style="top:2.31em;width:3.9em"></div>
          <div class="scene-bar scene-type1" style="top:2.77em"></div>
          <div class="scene-bar scene-type2" style="top:2.95em"></div>
          <div class="scene-bar scene-type3" style="top:3.13em"></div>
          <div class="scene-caret"></div>
        </div>
      </div>
      <div class="scene-sel"></div>
      <div class="scene-hint"><div class="scene-stat"><span>Weekly signups</span><strong>1,284</strong><div><i style="height:35%"></i><i style="height:50%"></i><i style="height:42%"></i><i style="height:68%"></i><i style="height:100%"></i></div></div></div>
      <div class="scene-keys"><kbd>⌘</kbd><kbd>⇧</kbd><kbd>2</kbd></div>
      <div class="scene-cursor">
        <div class="scene-ring"></div>
        <svg class="scene-arrow" viewBox="0 0 12 18"><path d="M1 1v14l3.6-3.4 2.3 5.3 2.2-1-2.3-5.2H11z" fill="#18181F" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <svg class="scene-cross" viewBox="0 0 20 20"><path d="M10 0v20M0 10h20" stroke="#fff" stroke-width="3.2"/><path d="M10 .8v18.4M.8 10h18.4" stroke="#18181F" stroke-width="1.4"/></svg>
      </div>
    </div>
  </div>
</div>
</body>
</html>
